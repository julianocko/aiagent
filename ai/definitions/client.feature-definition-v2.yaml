version: "2.0"

project:
  basePackage: com.prospera.api
  artifactId: client-api
  name: Client API
  description: REST API for client management
  javaVersion: 25
  database:
    type: postgresql
    version: "17.5"
  flyway:
    enabled: true
    schemaHistoryTable: public.flyway_schema_history

feature:
  name: client
  entity: Client
  resource: clients
  schema: client
  boundedContext: client-management
  tags:
    - client
    - management

entity:
  table: client
  aggregateRoot: true
  softDelete: false
  auditing: true
  id:
    name: id
    type: uuid
    generated: true

fields:
  - name: name
    type: string
    column: name
    required: true
    updatable: true
    searchable: true
    sortable: true
    validations:
      - notBlank
      - size:
          min: 3
          max: 255

  - name: status
    type: enum
    column: status
    required: true
    updatable: true
    enum:
      name: ClientStatus
      values:
        - ACTIVE
        - INACTIVE
        - PENDING
        - BLOCKED
    default: PENDING
    searchable: true
    sortable: true

  - name: active
    type: boolean
    column: active
    required: true
    updatable: true
    default: false
    searchable: true
    sortable: true

  - name: callbackUrl
    type: string
    column: callback_url
    required: false
    updatable: true
    searchable: false
    sortable: false
    validations:
      - size:
          max: 512
      - url

  - name: description
    type: string
    column: description
    required: false
    updatable: true
    searchable: true
    sortable: false
    validations:
      - size:
          max: 1024

  - name: externalCode
    type: string
    column: external_code
    required: false
    updatable: true
    searchable: true
    sortable: true
    validations:
      - size:
          max: 100

  - name: createdAt
    type: offsetDateTime
    column: created_at
    generated: true
    writable: false
    updatable: false
    sortable: true

  - name: updatedAt
    type: offsetDateTime
    column: updated_at
    generated: true
    writable: false
    updatable: false
    sortable: true

relationships:
  - name: callbackConfigurations
    type: oneToMany
    targetEntity: CallbackConfiguration
    mappedBy: client
    fetch: lazy
    required: false

  - name: company
    type: manyToOne
    targetEntity: Company
    joinColumn: company_id
    fetch: lazy
    required: false

valueObjects:
  - name: CallbackUrl
    field: callbackUrl
    type: string
    validations:
      - url
      - size:
          max: 512

indexes:
  - name: uk_client_name
    unique: true
    columns:
      - name

  - name: uk_client_external_code
    unique: true
    columns:
      - externalCode

  - name: idx_client_active
    columns:
      - active

  - name: idx_client_status
    columns:
      - status

constraints:
  - name: chk_client_name_not_blank
    type: check
    expression: "char_length(trim(name)) > 0"

businessRules:
  - code: CLIENT_ALREADY_EXISTS
    message: Client with the same name already exists

  - code: CLIENT_ALREADY_ACTIVE
    message: Client is already active

  - code: CLIENT_ALREADY_INACTIVE
    message: Client is already inactive

  - code: CLIENT_CANNOT_BE_DELETED_WHEN_ACTIVE
    message: Active clients cannot be deleted

  - code: CALLBACK_URL_REQUIRED_FOR_ACTIVE
    message: Callback URL must be provided when client is active

  - code: CLIENT_MUST_BELONG_TO_COMPANY_FOR_ACTIVATION
    message: Client must be associated with a company before activation

states:
  enabled: true
  field: status
  transitions:
    - from: PENDING
      to: ACTIVE
      action: activate-client

    - from: ACTIVE
      to: INACTIVE
      action: deactivate-client

    - from: INACTIVE
      to: ACTIVE
      action: reactivate-client

    - from: PENDING
      to: BLOCKED
      action: block-client

commands:
  - name: create-client
    useCase: CreateClientUseCase
    domainService: CreateClientDomainService

  - name: update-client
    useCase: UpdateClientUseCase
    domainService: UpdateClientDomainService

  - name: delete-client
    useCase: DeleteClientUseCase
    domainService: DeleteClientDomainService

  - name: activate-client
    useCase: ActivateClientUseCase
    domainService: ActivateClientDomainService

queries:
  - name: get-client-by-id
    useCase: FindClientByIdUseCase
    path: /clients/{id}

  - name: list-clients
    useCase: ListClientsUseCase
    path: /clients

  - name: search-clients
    useCase: SearchClientsUseCase
    path: /clients/search
    filters:
      - field: name
        operator: contains
      - field: active
        operator: eq
      - field: status
        operator: eq
      - field: externalCode
        operator: eq

endpoints:
  crud:
    enabled: true
    operations:
      - create
      - getById
      - list
      - update
      - patch
      - delete

  actions:
    - name: activate-client
      method: POST
      path: /clients/{id}/activate
      description: Activate a client
      scope: client.write
      useCase: ActivateClientUseCase

    - name: deactivate-client
      method: POST
      path: /clients/{id}/deactivate
      description: Deactivate a client
      scope: client.write
      useCase: DeactivateClientUseCase

    - name: block-client
      method: POST
      path: /clients/{id}/block
      description: Block a client
      scope: client.write
      useCase: BlockClientUseCase

filters:
  enabled: true
  allowed:
    - field: name
      type: string
      operator: contains

    - field: active
      type: boolean
      operator: eq

    - field: status
      type: enum
      operator: eq

    - field: createdAt
      type: offsetDateTime
      operator: between

pagination:
  enabled: true
  defaultSize: 20
  maxSize: 100

sorting:
  enabled: true
  defaultSort: name,asc
  allowedFields:
    - name
    - status
    - active
    - createdAt
    - updatedAt

security:
  enabled: true
  scopes:
    read: client.read
    write: client.write
  roles:
    - ADMIN
    - CLIENT_MANAGER

validation:
  requestValidation: true
  responseValidation: false
  failFast: true

response:
  envelope: true
  problemDetails: true

openapi:
  enabled: true
  tag: Client
  description: Client management endpoints
  generateFeatureFragment: true
  generateRootPaths: true

events:
  enabled: false
  published:
    - ClientCreated
    - ClientActivated
    - ClientBlocked

testing:
  generateUnitTests: true
  generateControllerTests: true
  generateRepositoryTests: true
  generateIntegrationTests: true
  generateSecurityTests: true

generation:
  generateEntity: true
  generateAggregates: true
  generateUseCases: true
  generateDomainServices: true
  generateController: true
  generateRepositoryImpl: true
  generateAssembler: true
  generateOpenApi: true
  generateMigration: true
  generateTests: true

migration:
  initialVersion: 1.0.0
  createTable: true
  schema: client
  includeIndexes: true
  includeConstraints: true
