version: "2.0"

project:
  basePackage: com.prospera.api
  artifactId: client-api
  name: Client API
  description: REST API for client management
  javaVersion: 25
  database:
    type: postgresql
    version: latest
  flyway:
    enabled: true
    schemaHistoryTable: public.flyway_schema_history

feature:
  name: client
  entity: Client
  resource: clients
  schema: client

entity:
  table: client
  aggregateRoot: true
  softDelete: false
  auditing: true
  id:
    name: id
    type: uuid
    generated: true
    databaseDefault: uuid_generate_v4()

fields:
  - name: name
    type: string
    column: name
    required: true
    validations:
      - notBlank
      - size:
          min: 3
          max: 255

  - name: active
    type: boolean
    column: active
    required: true
    default: false

  - name: callbackUrl
    type: string
    column: callback_url
    required: false
    validations:
      - size:
          max: 512
      - url

  - name: description
    type: string
    column: description
    required: false
    validations:
      - size:
          max: 1024

  - name: createdAt
    type: offsetDateTime
    column: created_at
    generated: true
    writable: false

  - name: updatedAt
    type: offsetDateTime
    column: updated_at
    generated: true
    writable: false

businessRules:
  - code: CLIENT_ALREADY_EXISTS
    message: Client with the same name already exists
  - code: CLIENT_ALREADY_ACTIVE
    message: Client is already active
  - code: CALLBACK_URL_REQUIRED_FOR_ACTIVE
    message: Callback URL must be provided when client is active

endpoints:
  crud:
    enabled: true
    operations:
      - create
      - getById
      - list
      - update
      - patch
      - delete

security:
  enabled: true
  scopes:
    read: client.read
    write: client.write

openapi:
  enabled: true
  tag: Client

testing:
  generateUnitTests: true
  generateControllerTests: true
  generateRepositoryTests: true

migration:
  initialVersion: 1.0.0
  createTable: true
  schema: client
  includeIndexes: true
  includeConstraints: true
  uuidExtension: uuid-ossp
  idDefaultFunction: uuid_generate_v4()
