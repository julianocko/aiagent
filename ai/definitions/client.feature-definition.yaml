version: "1.0"

project:
  basePackage: com.juliano
  artifactId: client-api
  name: Client API
  description: REST API for client management

feature:
  name: client
  entity: Client
  resource: clients
  schema: client

entity:
  table: client
  id:
    name: id
    type: uuid
    generated: true

fields:

  - name: name
    type: string
    column: name
    required: true
    validations:
      - notBlank
      - size:
          min: 3
          max: 255

  - name: active
    type: boolean
    column: active
    required: true
    default: false

  - name: callbackUrl
    type: string
    column: callback_url
    required: false
    validations:
      - size:
          max: 512
      - url

  - name: description
    type: string
    column: description
    required: false
    validations:
      - size:
          max: 1024

  - name: createdAt
    type: offsetDateTime
    column: created_at
    generated: true
    writable: false

  - name: updatedAt
    type: offsetDateTime
    column: updated_at
    generated: true
    writable: false

indexes:

  - name: uk_client_name
    unique: true
    columns:
      - name

  - name: idx_client_active
    columns:
      - active

businessRules:

  - code: CLIENT_ALREADY_EXISTS
    message: Client with the same name already exists

  - code: CLIENT_ALREADY_ACTIVE
    message: Client is already active

  - code: CLIENT_ALREADY_INACTIVE
    message: Client is already inactive

  - code: CALLBACK_URL_REQUIRED_FOR_ACTIVE
    message: Callback URL must be provided when client is active

endpoints:

  crud:
    enabled: true
    operations:
      - create
      - getById
      - list
      - update
      - patch
      - delete

  actions:

    - name: activate-client
      method: POST
      path: /clients/{id}/activate
      description: Activate a client
      scope: client.write
      useCase: ActivateClientUseCase

    - name: deactivate-client
      method: POST
      path: /clients/{id}/deactivate
      description: Deactivate a client
      scope: client.write
      useCase: DeactivateClientUseCase

queries:

  - name: find-by-name
    method: GET
    path: /clients/search
    description: Search client by name
    parameters:
      - name: name
        type: string
        required: true
    repositoryMethod: findByNameContainingIgnoreCase

security:

  enabled: true

  scopes:
    read: client.read
    write: client.write

  roles:
    - ADMIN
    - CLIENT_MANAGER

validation:

  requestValidation: true
  responseValidation: false

openapi:

  enabled: true
  tag: Client
  description: Client management endpoints

testing:

  generateUnitTests: true
  generateControllerTests: true
  generateRepositoryTests: true
  generateIntegrationTests: false

migration:

  initialVersion: 1.0.0
  createTable: true
  schema: client

pagination:

  enabled: true
  defaultSize: 20
  maxSize: 100

sorting:

  enabled: true
  defaultSort: name,asc